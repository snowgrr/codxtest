<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIN Maker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <header class="brand">
        <div>
          <h1>TIN Maker</h1>
          <p>CCTV 이미지와 지도 좌표를 같은 TIN 포인트로 매칭합니다.</p>
        </div>
        <button id="clearBtn" class="icon-btn danger" title="전체 초기화" aria-label="전체 초기화">
          <span aria-hidden="true">×</span>
        </button>
      </header>

      <section class="panel">
        <h2>배경</h2>
        <label class="file-drop">
          <input id="mapImageInput" type="file" accept="image/*">
          <span>지도 이미지 불러오기</span>
        </label>
        <label class="file-drop">
          <input id="cctvImageInput" type="file" accept="image/*">
          <span>CCTV 이미지 불러오기</span>
        </label>
        <div class="toggle-row">
          <label><input id="showImage" type="checkbox" checked> 이미지</label>
          <label><input id="showGrid" type="checkbox" checked> 격자</label>
          <label><input id="showLabels" type="checkbox" checked> 번호</label>
        </div>
      </section>

      <section class="panel">
        <h2>TIN 제어</h2>
        <label class="range-row">
          <span>최대 변 길이</span>
          <output id="edgeValue">420 px</output>
          <input id="edgeLimit" type="range" min="80" max="1200" value="420" step="10">
        </label>
        <label class="range-row">
          <span>최소 내각</span>
          <output id="angleValue">12°</output>
          <input id="angleLimit" type="range" min="1" max="45" value="12" step="1">
        </label>
        <label class="range-row">
          <span>경고/제외 투명도</span>
          <output id="warningOpacityValue">45%</output>
          <input id="warningOpacity" type="range" min="0" max="100" value="45" step="5">
        </label>
        <div class="toggle-row">
          <label><input id="hideExcludedTin" type="checkbox" checked> 외곽 제외 숨김</label>
        </div>
      </section>

      <section class="panel selected-panel">
        <h2>선택 포인트</h2>
        <div id="emptySelection" class="muted">오른쪽 CCTV에 포인트를 찍은 뒤 왼쪽 지도에 대응 포인트를 찍으세요.</div>
        <div id="pointEditor" class="point-editor hidden">
          <label>CCTV X <input id="cctvX" type="number" step="0.1"></label>
          <label>CCTV Y <input id="cctvY" type="number" step="0.1"></label>
          <label>지도 X <input id="mapX" type="number" step="0.1" placeholder="지도에서 클릭"></label>
          <label>지도 Y <input id="mapY" type="number" step="0.1" placeholder="지도에서 클릭"></label>
          <button id="deletePointBtn" class="full danger">선택 포인트 삭제</button>
        </div>
      </section>

      <section class="panel stats">
        <h2>상태</h2>
        <dl>
          <div><dt>전체 포인트</dt><dd id="pointCount">0</dd></div>
          <div><dt>지도 매칭</dt><dd id="matchedCount">0</dd></div>
          <div><dt>유효 TIN</dt><dd id="tinCount">0</dd></div>
          <div><dt>외곽 제외</dt><dd id="excludedCount">0</dd></div>
          <div><dt>내부 경고</dt><dd id="warningCount">0</dd></div>
        </dl>
      </section>

      <section class="panel advice">
        <h2>개선 권장</h2>
        <div id="qualityAdvice" class="muted">CCTV 포인트 3개 이상부터 TIN 품질을 평가합니다.</div>
      </section>

      <section class="panel actions">
        <h2>데이터</h2>
        <button id="exportBtn" class="full">JSON 내보내기</button>
        <label class="file-import">
          <input id="jsonInput" type="file" accept="application/json,.json">
          <span>JSON 불러오기</span>
        </label>
      </section>
    </aside>

    <section class="workspace">
      <div class="toolbar">
        <button id="addModeBtn" class="mode active" data-mode="add" title="CCTV 포인트 추가">＋</button>
        <button id="selectModeBtn" class="mode" data-mode="select" title="선택/이동">↕</button>
        <button id="fitBtn" class="mode" title="양쪽 화면 맞춤">⌂</button>
        <div class="hint">오른쪽: CCTV 포인트/TIN · 왼쪽: 선택 포인트의 지도 위치 매칭</div>
      </div>

      <section class="split-view">
        <div class="pane map-pane">
          <div class="pane-title">지도</div>
          <canvas id="mapCanvas" width="900" height="900" aria-label="지도 포인트 매칭 캔버스"></canvas>
        </div>
        <div class="pane cctv-pane">
          <div class="pane-title">CCTV 이미지</div>
          <canvas id="cctvCanvas" width="900" height="900" aria-label="CCTV TIN 편집 캔버스"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
